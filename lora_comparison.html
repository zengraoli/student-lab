<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoRA 同条件对照 · 图像实验台</title>
<style>body{font:14px/1.6 "Microsoft YaHei",sans-serif;background:#f8fafc;color:#19324d;margin:0;padding:24px}main{max-width:1440px;margin:auto}h1{font-size:26px;margin:0}a{color:#196ac9}header{display:flex;justify-content:space-between;align-items:center}select,button{font:inherit;padding:8px;border:1px solid #a9baca;border-radius:5px;background:white;color:#19324d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}figure{margin:0;background:white;border:1px solid #dbe4ed;padding:10px}img{width:100%;display:block}h2{margin-top:32px;font-size:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.muted{color:#526b83}#notice{padding:12px 0}figcaption{font-size:13px;overflow-wrap:anywhere}figure{min-width:0}summary{cursor:pointer}</style>
<main><header><h1>LoRA 同条件对照</h1><a href="/">返回无限画布</a></header><p>同组提示词、尺寸、步数和种子一致；LoRA 强度 0.7。每款两个种子用于初步观察，不代表通用胜率。</p><label>种子 <select id="seed"><option>42</option><option>2026</option></select></label> <button id="refresh">刷新结果</button><div id="notice" role="status"></div><div id="groups"></div></main>
<script>
const groups=[['Qwen 2.1 · 中国女性肖像','qwen_portrait',['base','q_asian','q_nicegirls','q_lenovo']],['Z-Image-Turbo · 中国女性肖像','zimage_portrait',['base','z_asian']],['Z-Image-Turbo · 角色设定','zimage_sheet',['base','z_character']],['Z-Image-Turbo · 电影感','zimage_cinematic',['base','z_cinematic']]];
const labels={base:'原始模型',q_asian:'NiceGirls · Asians',q_nicegirls:'NiceGirls · v2',q_lenovo:'Lenovo · 写实',z_asian:'NiceGirls · Asians',z_character:'角色设定',z_cinematic:'Luneva · 电影感'};
async function render(){try{const r=await fetch('/api/lora-evaluation');if(!r.ok)throw Error('无法读取记录');const all=await r.json(),seed=document.getElementById('seed').value;document.getElementById('groups').replaceChildren();document.getElementById('notice').textContent=`当前 ${all.filter(x=>x.status==='succeeded').length} 个任务成功；点击图片查看原始 PNG。耗时不含模型加载与排队。`;
for(const [title,prefix,variants]of groups){const section=document.createElement('section'),h=document.createElement('h2'),grid=document.createElement('div');h.textContent=title;grid.className='grid';section.append(h,grid);for(const v of variants){const j=all.find(x=>x.example===`${prefix}_${v}_${seed}`),f=document.createElement('figure'),caption=document.createElement('figcaption');caption.textContent=labels[v];if(j?.status==='succeeded'){const a=document.createElement('a'),im=new Image();a.href=j.result.image;a.target='_blank';im.src=j.result.image;im.alt=title+' '+labels[v];a.append(im);f.append(a);const m=j.result.metrics;caption.textContent+=` · ${m.seconds.toFixed(2)} 秒 · ${m.gpu_total_peak_gib.toFixed(2)} GiB`;const detail=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');s.textContent='原始 prompt 与参数';p.textContent=JSON.stringify(j.request,null,2);detail.append(s,p);f.append(caption,detail);}else{caption.textContent+=' · '+(j?.status||'等待测试')+(j?.error?'：'+j.error:'');f.append(caption);}grid.append(f);}document.getElementById('groups').append(section);}}catch(e){document.getElementById('notice').textContent=e.message;}}
document.getElementById('seed').onchange=render;document.getElementById('refresh').onclick=render;render();
</script></html>
